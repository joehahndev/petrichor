services:
  petrichor_tasks.service:
    class: Drupal\petrichor_tasks\TaskService
    arguments: ['@entity_type.manager', '@entity_field.manager', '@datetime.time']
  petrichor_tasks.tool_provider:
    class: Drupal\petrichor_tasks\TaskToolProvider
    arguments: ['@petrichor_tasks.service']
    tags:
      - { name: petrichor_mcp.tool_provider }
