services:
  petrichor_tasks.service:
    class: Drupal\petrichor_tasks\TaskService
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@datetime.time'
      - '@database'
      # '@?' means "NULL if that service is not defined". petrichor_memory is
      # optional and this module must stay installable without it; get_task
      # simply omits related_memories when it is absent. Promoting this to '@'
      # would break the à-la-carte install.
      - '@?petrichor_memory.service'
      # Same reasoning: petrichor_tags is optional, and the 'tags' field it
      # attaches is simply absent without it.
      - '@?petrichor_tags.resolver'
  petrichor_tasks.tool_provider:
    class: Drupal\petrichor_tasks\TaskToolProvider
    arguments: ['@petrichor_tasks.service']
    tags:
      - { name: petrichor_mcp.tool_provider }
