langcode: en
status: true
# See comment.type.petrichor_worklog.yml: 'enforced' is what makes this config
# go away when petrichor_comments is uninstalled. The module list below is the
# field's own dependencies and does not include us.
dependencies:
  config:
    - field.storage.petrichor_task.worklog
  module:
    - comment
    - petrichor_tasks
  enforced:
    module:
      - petrichor_comments
id: petrichor_task.petrichor_task.worklog
field_name: worklog
entity_type: petrichor_task
bundle: petrichor_task
label: Worklog
description: ''
required: false
translatable: true
default_value:
  -
    status: 2
    cid: 0
    last_comment_timestamp: 0
    last_comment_name: null
    last_comment_uid: 0
    comment_count: 0
default_value_callback: ''
settings:
  default_mode: 1
  per_page: 50
  anonymous: 0
  form_location: true
  preview: 0
field_type: comment
